name: Sync fallback wedding site
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull public files from primary repository
        shell: bash
        run: |
          rm -rf .source
          git clone --depth=1 https://github.com/jbeatmakers/boda-julian-carla.git .source
          cp .source/index.html ./index.html
          cp .source/robots.txt ./robots.txt
          mkdir -p assets
          cp .source/assets/app.js .source/assets/styles.css ./assets/
          rm -rf .source CNAME
          touch .nojekyll
      - name: Commit only when the public site changed
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html robots.txt assets/app.js assets/styles.css .nojekyll
          git diff --cached --quiet || git commit -m 'Sync fallback from primary'
          git push
